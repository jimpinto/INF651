<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Opportunities | Southern Baptist Church</title>
    <link rel="stylesheet" href="churchfinal.css">
</head>
<body>
    <header>
        <h1>Welcome to Southern Baptist Church</h1>
        <p id="welcome-message"></p>
        <nav>
            <ul>
                <li><a href="churchindex.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="sermons.html">Sermons</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="donations.html">Donations</a></li>
                <li><a href="prayer-requests.html">Prayer Requests</a></li>

                <li><a href="testimonies.html">Testimonies</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="volunteer">
            <h2>Volunteer Opportunities</h2>
            <form id="volunteer-form">
                <label for="volunteer-name">Your Name:</label>
                <input type="text" id="volunteer-name" name="volunteer-name" required>

                <label for="volunteer-opportunity">Select Opportunity:</label>
                <select id="volunteer-opportunity" name="volunteer-opportunity" required>
                    <option value="event">Event Assistance</option>
                    <option value="outreach">Community Outreach</option>
                    <option value="youth">Youth Ministry</option>
                </select>

                <button type="submit">Sign Up</button>
            </form>
        </section>
    </main>

    </footer>

    <script src="churchjava.js"></script>
