        <section>
            <h2>Prayer Requests</h2>
            <form id="prayer-request-form">
                <label for="prayer-name">Your Name:</label>
                <input type="text" id="prayer-name" name="prayer-name" required>

                <label for="prayer-request">Prayer Request:</label>
                <textarea id="prayer-request" name="prayer-request" required></textarea>

                <label for="anonymous">Submit Anonymously:</label>
                <input type="checkbox" id="anonymous" name="anonymous">

                <button type="submit">Submit Prayer Request</button>
            </form>
